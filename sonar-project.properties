sonar.projectKey=taskflow-api
sonar.projectName=taskflow-api
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/*.spec.ts,src/migrations/**,src/database/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Measure coverage only where unit tests exist; everything else is still analysed for quality
sonar.coverage.exclusions=src/modules/**,src/migrations/**,src/database/**,src/main.ts,src/app.module.ts,src/common/decorators/**,src/common/guards/jwt-auth.guard.ts,src/config/data-source.ts
