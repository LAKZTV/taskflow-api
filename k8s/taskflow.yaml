# --- data stores (in-cluster, throwaway: emptyDir) -------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: taskflow-env, key: DB_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: taskflow-env, key: DB_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: taskflow-env, key: DB_NAME } }
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER"]
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: { app: redis }
  ports:
    - port: 6379
      targetPort: 6379
---
# --- blue / green application deployments ---------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-blue
spec:
  replicas: 1
  selector:
    matchLabels: { app: taskflow, color: blue }
  template:
    metadata:
      labels: { app: taskflow, color: blue }
    spec:
      containers:
        - name: app                      # ชื่อ "app" ต้องตรงกับ kubectl set image ... app=<image>
          image: registry:5000/taskflow-api:bootstrap  # ถูกแทนที่ด้วย pipeline / ขั้นตอน bootstrap
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef: { name: taskflow-env }
          env:
            - { name: DB_HOST, value: postgres }
            - { name: DB_PORT, value: "5432" }
            - { name: REDIS_URL, value: "redis://redis:6379" }
          readinessProbe:
            httpGet: { path: /health/ready, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-green
spec:
  replicas: 1
  selector:
    matchLabels: { app: taskflow, color: green }
  template:
    metadata:
      labels: { app: taskflow, color: green }
    spec:
      containers:
        - name: app
          image: registry:5000/taskflow-api:bootstrap
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef: { name: taskflow-env }
          env:
            - { name: DB_HOST, value: postgres }
            - { name: DB_PORT, value: "5432" }
            - { name: REDIS_URL, value: "redis://redis:6379" }
          readinessProbe:
            httpGet: { path: /health/ready, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 10
---
# per-color Services: ใช้ smoke test pod ใหม่ "ตรง ๆ" โดยไม่ผ่าน Service หลัก
apiVersion: v1
kind: Service
metadata:
  name: taskflow-blue
spec:
  selector: { app: taskflow, color: blue }
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: taskflow-green
spec:
  selector: { app: taskflow, color: green }
  ports:
    - port: 3000
      targetPort: 3000
---
# Service หลักที่ผู้ใช้เรียก — สลับสี = เปลี่ยน selector.color บรรทัดเดียว
apiVersion: v1
kind: Service
metadata:
  name: taskflow
spec:
  selector: { app: taskflow, color: blue }
  ports:
    - port: 3000
      targetPort: 3000
